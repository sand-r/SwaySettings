[workspace]
members = [
  "crates/core",
  "crates/settings",
  "crates/wallpaper",
  "crates/screenshot",
  "crates/locker",
  "crates/upower-monitor",
  "crates/autostart",
]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.5.0"
license = "GPL-3.0-or-later"

[workspace.dependencies]
anyhow = "1"
thiserror = "1"
once_cell = "1"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
log = "0.4"
env_logger = "0.11"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
shell-words = "1"
whoami = "1"
libc = "0.2"

# GTK / GNOME stack (latest alpha for GTK4 4.20 / libadwaita 1.8)
glib = "0.22.0-alpha.2"
gio = "0.22.0-alpha.2"
gio-unix = "0.22.0-alpha.2"
gdk4 = { package = "gdk4", version = "0.11.0-alpha.2", features = ["v4_20"] }
gsk4 = { package = "gsk4", version = "0.11.0-alpha.2", features = ["v4_20"] }
graphene = { package = "graphene-rs", version = "0.22.0-alpha.2" }
gtk4 = { package = "gtk4", version = "0.11.0-alpha.2", features = ["v4_20"] }
gdk-pixbuf = { package = "gdk-pixbuf", version = "0.22.0-alpha.2" }
libadwaita = { package = "libadwaita", version = "0.9.0-alpha.0", features = ["v1_8"] }

# Wayland helpers
gtk4-session-lock = { version = "0.4.1", features = ["v1_2"] }

# D-Bus
zbus = "5"

# Audio
pipewire = "0.9"

# Auth
