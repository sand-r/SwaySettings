[workspace]
members = [
  "crates/core",
  "crates/settings",
  "crates/wallpaper",
  "crates/screenshot",
  "crates/locker",
  "crates/portal",
  "crates/upower-monitor",
  "crates/autostart",
]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.5.0"
license = "GPL-3.0-or-later"

[workspace.dependencies]
anyhow = "1"
thiserror = "1"
once_cell = "1"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
log = "0.4"
env_logger = "0.11"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
shell-words = "1"
whoami = "1"
libc = "0.2"

# GTK / GNOME stack
glib = "0.19"
gio = "0.19"
gdk4 = { package = "gdk4", version = "0.8" }
gsk4 = { package = "gsk4", version = "0.8" }
graphene = { package = "graphene-rs", version = "0.17" }
gtk4 = { package = "gtk4", version = "0.8", features = ["v4_14"] }
gdk-pixbuf = { package = "gdk-pixbuf", version = "0.19" }
libadwaita = { package = "libadwaita", version = "0.6", features = ["v1_4"] }

# Wayland helpers

# D-Bus
zbus = "4"

# Auth
